    rel="stylesheet">

<body>
  <header class="header">
    <nav class="navbar">
      <a class="logo" href="#inicio">Rende<span>x</span></a>
      <div class="nav-links">
        <a href="/index.html">Início</a>
        <a class="active" href="/frontend/pages/dashboard.html">Dashboard</a>
        <a href="#trilha">Trilha de Aprendizado</a>

        <a href="#dividas">Sair das Dívidas</a>
      </div>
    </nav>
  </header>

  <main>
    <section class="card">
      <div class="card-header">
        <h2>Cadastre-se</h2>
        <p>Cadastre-se para poder aproveitar com liberdade nosso rendex</p>
      </div>

      <form action="">

        <label for="nome">Seu Nome</label>
        <input type="text" id="nome" name="nome" required>

        <label for="email">Email</label>
        <input type="text" id="email" name="email" required>

        <label for="password">Senha</label>
        <input type="password" id="password" name="password" required>

        <label for="confirm_password">Confirmar Senha</label>
        <input type="password" id="confirm_password" name="confirm_password" required>

        <button type="submit" class="btn">Crie sua conta</button>
      </form>
    </section>
  </main>

  <footer class="footer">
    <div class="footer-links">
      <a href="#">Linktree</a>

      <a href="#">Patrocinadores</a>

  </footer>
